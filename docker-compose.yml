version: "3.8"

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPPLIER_A_URL=http://api:3000
      - SUPPLIER_B_URL=http://api:3000
      - LOG_LEVEL=info
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPPLIER_A_URL=http://api:3000
      - SUPPLIER_B_URL=http://api:3000
      - LOG_LEVEL=info
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
